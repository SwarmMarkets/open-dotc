[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = true
fs_permissions = [{ access = "read", path = "./" }]

[profile.ci]
optimizer = true
optimizer_runs = 400
via_ir = true

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
arbitrum = "${ARBITRUM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
base = "${BASE_RPC_URL}"

[etherscan]
mainnet  = { key = "${ETHERSCAN_API_KEY}" }
arbitrum = { key = "${ARBISCAN_API_KEY}" }
polygon  = { key = "${POLYGONSCAN_API_KEY}" }
base     = { key = "${BASESCAN_API_KEY}" }

[fmt]
line_length = 100
wrap_comments = true
